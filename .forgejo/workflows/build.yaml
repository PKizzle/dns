on: [push, pull_request]

jobs:
  test:
    runs-on: atoom
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GOVERSION }}
      - run: |
          go build
          go test -race -v ./...
  perf:
    runs-on: atoom
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GOVERSION }}
      - uses: actions/upload-artifact@v6
        with:
          name: benchstat
          path: /tmp/benchstat
      - run: |
          apt-get install -y dnsperf
          cd cmd/reflect
          go build
          export HOSTNAME=runner
          make new.txt
          go install golang.org/x/perf/cmd/benchstat@latest
          make stat > /tmp/benchstat
