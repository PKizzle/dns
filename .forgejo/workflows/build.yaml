on: [push, pull_request]

jobs:
  test:
    runs-on: atoom
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: |
          go build
          go test -race -v ./...
          (cd cmd/atomdns; GOOS=windows go build)
          (cd cmd/atomdns; GOOS=darwin go build)
